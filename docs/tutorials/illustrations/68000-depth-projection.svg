<svg xmlns="http://www.w3.org/2000/svg" width="760" height="280" viewBox="0 0 760 280" role="img" aria-labelledby="title desc">
<title id="title">Depth controls the perspective scale</title>
<desc id="desc">Side view with the camera at left, and two vertices at identical height at depths 64 and 128. Their rays cross the projection plane at heights in a two-to-one ratio.</desc>
<rect x="1" y="1" width="758" height="278" rx="16" fill="#f7fafc" stroke="#aab9c9"/>
<g font-family="DejaVu Sans, Arial, sans-serif" fill="#182b42"><text x="26" y="38" font-size="23" font-weight="bold">Double the depth, halve the screen offset</text><path d="M88,225 L694,225" fill="none" stroke="#6d8195" stroke-width="1.5" /><path d="M216,101 L216,234" fill="none" stroke="#6d8195" stroke-width="1.5" /><path d="M344,129 L600,129" fill="none" stroke="#cad7e3" stroke-width="1" stroke-dasharray="5 4"/><path d="M344,129 L344,225" fill="none" stroke="#cad7e3" stroke-width="1" stroke-dasharray="5 4"/><path d="M600,129 L600,225" fill="none" stroke="#cad7e3" stroke-width="1" stroke-dasharray="5 4"/><path d="M88,225 L344,129" fill="none" stroke="#11659d" stroke-width="3" /><path d="M88,225 L600,129" fill="none" stroke="#a84315" stroke-width="3" /><circle cx="88" cy="225" r="5" fill="#182b42" /><circle cx="216" cy="177" r="4" fill="#11659d" /><circle cx="216" cy="201" r="4" fill="#a84315" /><circle cx="344" cy="129" r="5" fill="#11659d" /><circle cx="600" cy="129" r="5" fill="#a84315" /><text x="216" y="87" font-size="14" text-anchor="middle">Projection plane</text><text x="206" y="171" font-size="14" text-anchor="end" fill="#11659d">16 px</text><text x="206" y="214" font-size="14" text-anchor="end" fill="#a84315">8 px</text><text x="344" y="112" font-size="15" text-anchor="middle">y = 8</text><text x="600" y="112" font-size="15" text-anchor="middle">y = 8</text><text x="88" y="251" font-size="14" text-anchor="middle">Camera</text><text x="344" y="251" font-size="14" text-anchor="middle">z = 64</text><text x="600" y="251" font-size="14" text-anchor="middle">z = 128</text><text x="706" y="230" font-size="16" >z</text></g></svg>
