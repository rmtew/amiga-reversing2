<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="455" viewBox="0 0 1000 455" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">What the focal length means and why distant points project smaller</title>
<desc id="diagram-desc">The camera is at z zero and looks right along positive z. A screen plane is located at z 32 scene units, with four pixels per scene unit on the plane. Two points have the same camera-space height, about 2.828 scene units, at z 64 and 128. The ray through the near point reaches the screen about 5.66 pixels above centre; the ray through the far point reaches it about 2.83 pixels above centre. The camera-to-plane distance yields a focal length of 128 pixels. The horizontal and vertical scene axes are drawn at different scales.</desc>
