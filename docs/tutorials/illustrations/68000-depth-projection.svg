<text x="47" y="409" fill="#14243b" font-size="18" font-family="system-ui, -apple-system, sans-serif" font-weight="650" text-anchor="start">Focal length = camera-to-plane distance × scale on the plane</text>
<text x="47" y="434" fill="#415672" font-size="16" font-family="system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">32 scene units × 4 pixels per scene unit = 128 pixels. The y scale is exaggerated in this diagram.</text>
