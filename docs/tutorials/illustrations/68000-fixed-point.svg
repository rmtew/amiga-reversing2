<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="486" viewBox="0 0 1000 486" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">Rounding unit steps first versus retaining fixed-point fractions</title>
<desc id="diagram-desc">Both columns take three steps along A and one along B. On the left, rounding the unit steps to (1,1) and (-1,1) before building the table gives (2,4). On the right, steps are stored in units of 1/256: A is (181,181) and B is (-181,181). Integer adds give (362,724), representing (1.414,2.828). Rounding now gives (1,3).</desc>
<defs><marker id="blue" markerWidth="8" markerHeight="8" refX="6.7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#1e56a4"/></marker><marker id="orange" markerWidth="8" markerHeight="8" refX="6.7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#9d3f16"/></marker><marker id="grey" markerWidth="8" markerHeight="8" refX="6.7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#617993"/></marker><marker id="teal" markerWidth="8" markerHeight="8" refX="6.7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#06677a"/></marker></defs>
<rect x="0.5" y="0.5" width="999" height="485" rx="16" fill="#ffffff" stroke="#d6e2ef"/>
<text x="27" y="40" fill="#14243b" font-size="26" font-family="system-ui, -apple-system, sans-serif" font-weight="650" text-anchor="start">Where you round can move the vertex</text>
<text x="27" y="71" fill="#415672" font-size="18" font-family="system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">Same walk in both columns: three steps along A, then one along B.</text>
<rect x="26" y="91" width="462" height="348" rx="12" fill="#f6f9fd" stroke="#d6e2ef"/>
<rect x="512" y="91" width="462" height="348" rx="12" fill="#f6f9fd" stroke="#d6e2ef"/>
<text x="48" y="129" fill="#14243b" font-size="22" font-family="system-ui, -apple-system, sans-serif" font-weight="650" text-anchor="start">Round each unit step first</text>
<text x="535" y="129" fill="#14243b" font-size="22" font-family="system-ui, -apple-system, sans-serif" font-weight="650" text-anchor="start">Keep fractions until the end</text>
<circle cx="59" cy="157" r="11" fill="#9d3f16" stroke="none" stroke-width="1"/><text x="59" y="161.5" fill="#ffffff" font-size="13" font-family="system-ui, -apple-system, sans-serif" font-weight="650" text-anchor="middle">1</text>
<circle cx="59" cy="225" r="11" fill="#9d3f16" stroke="none" stroke-width="1"/><text x="59" y="229.5" fill="#ffffff" font-size="13" font-family="system-ui, -apple-system, sans-serif" font-weight="650" text-anchor="middle">2</text>
<circle cx="59" cy="293" r="11" fill="#9d3f16" stroke="none" stroke-width="1"/><text x="59" y="297.5" fill="#ffffff" font-size="13" font-family="system-ui, -apple-system, sans-serif" font-weight="650" text-anchor="middle">3</text>
<rect x="48" y="343" width="417" height="70" rx="9" fill="#ffffff" stroke="#d6e2ef"/>
<circle cx="546" cy="157" r="11" fill="#06677a" stroke="none" stroke-width="1"/><text x="546" y="161.5" fill="#ffffff" font-size="13" font-family="system-ui, -apple-system, sans-serif" font-weight="650" text-anchor="middle">1</text>
<circle cx="546" cy="225" r="11" fill="#06677a" stroke="none" stroke-width="1"/><text x="546" y="229.5" fill="#ffffff" font-size="13" font-family="system-ui, -apple-system, sans-serif" font-weight="650" text-anchor="middle">2</text>
<circle cx="546" cy="293" r="11" fill="#06677a" stroke="none" stroke-width="1"/><text x="546" y="297.5" fill="#ffffff" font-size="13" font-family="system-ui, -apple-system, sans-serif" font-weight="650" text-anchor="middle">3</text>
<rect x="535" y="343" width="417" height="70" rx="9" fill="#ffffff" stroke="#d6e2ef"/>
<text x="78" y="164" fill="#415672" font-size="16" font-family="system-ui, -apple-system, sans-serif" font-weight="650" text-anchor="start">Store integer steps</text>
<text x="78" y="190" fill="#14243b" font-size="17" font-family="monospace" font-weight="400" text-anchor="start">A = ( 1, 1),  B = (−1, 1)</text>
<text x="78" y="232" fill="#415672" font-size="16" font-family="system-ui, -apple-system, sans-serif" font-weight="650" text-anchor="start">Take three A steps</text>
<text x="78" y="258" fill="#14243b" font-size="17" font-family="monospace" font-weight="400" text-anchor="start">3A = (3, 3)</text>
<text x="78" y="300" fill="#415672" font-size="16" font-family="system-ui, -apple-system, sans-serif" font-weight="650" text-anchor="start">Add one B step</text>
<text x="78" y="326" fill="#14243b" font-size="17" font-family="monospace" font-weight="400" text-anchor="start">3A + B = (2, 4)</text>
<text x="565" y="164" fill="#415672" font-size="16" font-family="system-ui, -apple-system, sans-serif" font-weight="650" text-anchor="start">Store steps in units of 1/256</text>
<text x="565" y="190" fill="#14243b" font-size="17" font-family="monospace" font-weight="400" text-anchor="start">A = (181,181), B = (−181,181)</text>
<text x="565" y="232" fill="#415672" font-size="16" font-family="system-ui, -apple-system, sans-serif" font-weight="650" text-anchor="start">Take three A steps</text>
<text x="565" y="258" fill="#14243b" font-size="17" font-family="monospace" font-weight="400" text-anchor="start">3A = (543, 543)</text>
<text x="565" y="300" fill="#415672" font-size="16" font-family="system-ui, -apple-system, sans-serif" font-weight="650" text-anchor="start">Add one B step</text>
<text x="565" y="326" fill="#14243b" font-size="17" font-family="monospace" font-weight="400" text-anchor="start">3A + B = (362, 724)</text>
<text x="64" y="371" fill="#415672" font-size="16" font-family="system-ui, -apple-system, sans-serif" font-weight="650" text-anchor="start">Final whole-unit position</text>
<text x="64" y="398" fill="#9d3f16" font-size="24" font-family="system-ui, -apple-system, sans-serif" font-weight="650" text-anchor="start">(2, 4)</text>
<text x="552" y="371" fill="#415672" font-size="16" font-family="system-ui, -apple-system, sans-serif" font-weight="650" text-anchor="start">Divide by 256, then round</text>
<text x="552" y="398" fill="#06677a" font-size="22" font-family="system-ui, -apple-system, sans-serif" font-weight="650" text-anchor="start">(1.414, 2.828) → (1, 3)</text>
<text x="27" y="465" fill="#415672" font-size="16" font-family="system-ui, -apple-system, sans-serif" font-weight="400" text-anchor="start">In a renderer, you can keep the fractions through projection instead of rounding in world space.</text>
</svg>
