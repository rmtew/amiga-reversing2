<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="454" viewBox="0 0 1000 454" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">Four steps in the original and 45-degree rotated grid</title>
<desc id="diagram-desc">On the left, steps one, two and three go one unit right on the model X axis, then step four goes up on Y to P, which is (3,1,0). On the right, the same three X steps go diagonally up and right along A, reaching X[3]. One Y step adds Y[1], diagonally up and left along B, to reach (1.414,2.828). The output axes are still horizontal and vertical; the grid directions have turned.</desc>
